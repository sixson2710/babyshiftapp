<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BabyShift">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BabyShift</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#18212a;font-family:Arial,sans-serif}header{background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-size:22px;font-weight:800}.small{color:#68747d;font-size:13px}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0 0 5px;font-size:27px}h2{margin:0;font-size:19px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;font-size:14px;cursor:pointer}.black{background:#18212a;color:#fff}.gray{background:#e9edf0;color:#27323a}.green{background:#2e8b57;color:#fff}.red{background:#c83c3c;color:#fff}.task{border:1px solid #ddd;border-radius:12px;padding:13px;margin-top:9px;display:flex;justify-content:space-between;align-items:center;gap:12px}.task.done{background:#f0faf2;border-color:#b9d9c0}.name{font-weight:800}.meta{margin-top:5px;color:#68747d;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.progress-bg{height:9px;background:#e5e9ec;border-radius:20px;overflow:hidden;margin:11px 0}.progress{height:100%;background:#2e8b57;width:0}.filters{display:flex;gap:7px;flex-wrap:wrap}.log,.entry{padding:9px 11px;background:#f7f8f9;border-radius:8px;margin-top:7px;font-size:13px}.repeat-count{font-size:12px;color:#66727b;margin-left:6px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;z-index:10;padding:18px}.box{width:min(480px,100%);background:#fff;border-radius:16px;padding:20px}.box h2{margin-bottom:14px}.box label{display:block;font-size:13px;font-weight:700;margin:11px 0 5px}.box input,.box select{width:100%;padding:11px;border:1px solid #ccd2d7;border-radius:9px;font-size:15px}.actions-modal{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}.error{color:#c83c3c;font-size:13px;margin-top:7px}.diary{display:none;position:fixed;inset:0;background:#f5f2ec;z-index:20;overflow:auto}.diary-inner{max-width:850px;margin:auto;padding:16px}.diary-head{display:flex;justify-content:space-between;gap:8px}.diary-title{text-align:center;margin:15px}.diary-title h1{font-family:Georgia,serif}.diary-nav,.search{display:flex;justify-content:center;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}.diary-card{background:#fffdf9;border:1px solid #ded8cf;border-radius:16px;padding:20px}.photo{width:190px;margin:0 auto 20px;background:#fff;padding:9px 9px 22px;box-shadow:0 4px 15px #0002;text-align:center}.photo img{width:100%;height:165px;object-fit:cover}.note{width:100%;border:0;border-bottom:1px dashed #bbb;background:transparent;padding:8px;font-size:15px;outline:none}.line{display:grid;grid-template-columns:55px 1fr auto;gap:8px;padding:10px 2px;border-bottom:1px dashed #ddd;font-size:13px}.empty{text-align:center;padding:25px;color:#888}@media(max-width:650px){.task{flex-direction:column;align-items:stretch}.actions{justify-content:flex-start}.actions button{flex:1}.line{grid-template-columns:48px 1fr}.line small{grid-column:2}}
</style>
</head>
<body>
<div id="diary" class="diary"><div class="diary-inner"><div class="diary-head"><button id="backDiary" class="gray">← Torna al turno</button><button id="todayDiary" class="gray">Oggi</button></div><div class="diary-title"><h1>📖 Il Diario</h1><p id="diaryChild" class="small"></p></div><div class="search"><input id="datePicker" type="date"><button id="goDate" class="gray">Vai alla data</button></div><div class="diary-nav"><button id="prevDay" class="gray">‹ Giorno precedente</button><strong id="diaryDate"></strong><button id="nextDay" class="gray">Giorno successivo ›</button></div><div id="diaryCard" class="diary-card"></div></div></div>
<header><div><div class="brand">BabyShift</div><div class="small">Passaggio di consegne digitale</div></div><button id="operator" class="gray">Operatore: Demo</button><button id="childBtn" class="gray">👶 Bambino</button><button id="diaryBtn" class="gray">📖 Diario</button></header>
<main><div class="card"><h1>👶 <span id="childName">Bambino</span> — <span id="childAge">4 mesi</span></h1><div id="date" class="small"></div></div><div class="card"><div class="top"><h2>Stato del turno</h2><strong id="counter">0/0</strong></div><div class="progress-bg"><div id="progress" class="progress"></div></div><div class="filters"><button id="all" class="black">Tutto</button><button id="todo" class="gray">Da fare</button><button id="done" class="gray">Fatto</button></div></div><div class="card"><div class="top"><div><h2>Attività</h2><div class="small">Crea e modifica le attività della giornata.</div></div><button id="new" class="black">+ Nuova attività</button></div><div id="tasks"></div></div><div class="card"><h2>Ultime attività</h2><div id="logs"></div></div></main>
<div id="modal" class="modal"><div class="box"><h2 id="mtitle"></h2><div id="mbody"></div><div id="merror" class="error"></div></div></div>
<script>
(function(){
const KEY='babyshift_state_v1';let state={tasks:[],child:{name:'Bambino',age:'4 mesi'},operator:'Demo',diary:[],day:dayKey(new Date())};let filter='all',diaryDate=new Date(),modalData={};
const $=id=>document.getElementById(id);function dayKey(d){return d.toISOString().slice(0,10)}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;','\\':'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)state=Object.assign(state,x)}catch(e){}}function open(title,body){$('mtitle').textContent=title;$('mbody').innerHTML=body;$('merror').textContent='';$('modal').style.display='flex'}function close(){$('modal').style.display='none'}function detect(n){n=n.toLowerCase();if(/latte|biberon|ml/.test(n))return'🍼';if(/poppata|allattamento|pasto|pappa/.test(n))return'🍽️';if(/pannolino/.test(n))return'💧';if(/bagno|bagnetto|igiene/.test(n))return'🛁';if(/dormire|sonno|nanna/.test(n))return'😴';if(/vestit|body|pigiama|tuta/.test(n))return'👕';if(/temperatura|febbre|termometro/.test(n))return'🌡️';if(/medicina|farmaco|vitamina|gocce/.test(n))return'💊';if(/gioco/.test(n))return'🧸';if(/passeggiata|uscita/.test(n))return'🚶';if(/pulire|pulizia/.test(n))return'🧹';return'📌'}
function seed(){if(state.tasks.length)return;state.tasks=[{id:1,name:'Latte',repeatable:true,type:'milk',entries:[]},{id:2,name:'Poppata',repeatable:true,type:'feed',entries:[]},{id:3,name:'Cambio pannolino',repeatable:true,type:'diaper',entries:[]},{id:4,name:'Messo a dormire',repeatable:true,type:'sleep',entries:[]},{id:5,name:'Temperatura',repeatable:true,type:'temperature',entries:[]},{id:6,name:'Medicina / vitamina',repeatable:true,type:'medicine',entries:[]},{id:7,name:'Vestiti',repeatable:false,done:false},{id:8,name:'Passeggiata / uscita',repeatable:false,done:false}];save()}
function add(){open('Nuova attività','<label>Nome</label><input id="tn" placeholder="Es. Pulizia cameretta"><div class="small" id="preview">📌</div><label><input id="tr" type="checkbox"> Attività ripetibile durante la giornata</label><label>Tipo</label><select id="tt"><option value="generic">Generica</option><option value="milk">Latte</option><option value="feed">Poppata</option><option value="diaper">Pannolino</option><option value="medicine">Medicina / vitamina</option><option value="temperature">Temperatura</option><option value="sleep">Sonno</option></select><div class="actions-modal"><button class="gray" onclick="closeM()">Annulla</button><button class="black" id="saveT">Crea</button></div>');$('tn').oninput=()=>{$('preview').textContent=detect($('tn').value)};$('saveT').onclick=()=>{let n=$('tn').value.trim();if(!n){$('merror').textContent='Inserisci un nome.';return}state.tasks.push({id:Date.now(),name:n,repeatable:$('tr').checked,type:$('tt').value,done:false,entries:[]});save();close();render()}}
function edit(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;open('Modifica attività','<label>Nome</label><input id="en" value="'+esc(t.name)+'"><label><input id="er" type="checkbox" '+(t.repeatable?'checked':'')+'> Ripetibile durante la giornata</label><div class="actions-modal"><button class="gray" onclick="closeM()">Annulla</button><button class="black" id="saveE">Salva</button></div>');$('saveE').onclick=()=>{t.name=$('en').value.trim()||t.name;t.repeatable=$('er').checked;save();close();render()}}
function del(id){if(!confirm('Eliminare questa attività?'))return;state.tasks=state.tasks.filter(x=>x.id!==id);save();render()}
function complete(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;let d=new Date();t.done=true;t.time=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});t.who=state.operator;save();render()}
function undo(id){let t=state.tasks.find(x=>x.id===id);if(t){t.done=false;t.time='';t.who='';save();render()}}
function repeat(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;let extra='';if(t.type==='milk')extra='<label>Quantità (ml)</label><input id="amount" type="number" min="0">';if(t.type==='medicine')extra='<label>Dose / dettaglio</label><input id="med">';if(t.type==='temperature')extra='<label>Temperatura (°C)</label><input id="temp" type="number" step="0.1">';if(t.type==='sleep')extra='<label>Durata</label><div style="display:flex;gap:8px"><input id="hh" type="number" min="0" placeholder="Ore"><input id="mm" type="number" min="0" max="59" placeholder="Minuti"></div>';open('Registra: '+t.name,(t.type==='feed'?'<label>Tipo</label><select id="feed"><option>Latte artificiale</option><option>Latte materno</option><option>Pasto</option></select>':'')+(t.type==='diaper'?'<label>Cambio</label><select id="diaper"><option>Bagnato</option><option>Sporco</option><option>Entrambi</option><option>Pulito</option></select>':'')+extra+'<label>Nota (facoltativa)</label><input id="rn" placeholder="Dettagli"><div class="actions-modal"><button class="gray" onclick="closeM()">Annulla</button><button class="black" id="saveR">Registra</button></div>');$('saveR').onclick=()=>{let detail='';if($('amount'))detail=$('amount').value?$('amount').value+' ml':'';if($('med'))detail=$('med').value;if($('temp'))detail=$('temp').value?$('temp').value+' °C':'';if($('feed'))detail=$('feed').value;if($('diaper'))detail=$('diaper').value;if($('hh')||$('mm')){let h=+$('hh').value||0,m=+$('mm').value||0;detail=(h?h+'h ':'')+(m?m+'min':'')}t.entries=t.entries||[];t.entries.push({time:new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),who:state.operator,detail,note:$('rn').value});save();close();render()}}
function openRepeat(id){let t=state.tasks.find(x=>x.id===id),e=t.entries||[];let body=e.length?e.map((x,i)=>'<div class="entry"><b>'+esc(x.time)+'</b> · '+esc(x.who)+(x.detail?' · '+esc(x.detail):'')+(x.note?' — '+esc(x.note):'')+' <button class="red" style="float:right;padding:5px 8px" onclick="deleteEntry('+id+','+i+')">🗑</button></div>').join(''):'<div class="empty">Nessuna registrazione ancora oggi.</div>';open(t.name,body+'<div class="actions-modal"><button class="gray" onclick="closeM()">Chiudi</button><button class="black" onclick="closeM();repeat('+id+')">+ Registra</button></div>')}
function deleteEntry(id,i){let t=state.tasks.find(x=>x.id===id);if(!t||!t.entries)return;if(!confirm('Eliminare questa registrazione?'))return;t.entries.splice(i,1);save();close();openRepeat(id);render()}
function operator(){open('Operatore','<label>Nome</label><input id="op" value="'+esc(state.operator)+'"><div class="actions-modal"><button class="gray" onclick="closeM()">Annulla</button><button class="black" id="saveO">Salva</button></div>');$('saveO').onclick=()=>{state.operator=$('op').value.trim()||'Demo';save();close();render()}}
function child(){open('Impostazioni bambino','<label>Nome</label><input id="cn" value="'+esc(state.child.name)+'"><label>Età</label><input id="ca" value="'+esc(state.child.age)+'"><div class="actions-modal"><button class="gray" onclick="closeM()">Annulla</button><button class="black" id="saveC">Salva</button></div>');$('saveC').onclick=()=>{state.child.name=$('cn').value.trim()||'Bambino';state.child.age=$('ca').value.trim()||'4 mesi';save();close();render();renderDiary()}}
function render(){let normal=state.tasks.filter(t=>!t.repeatable),done=normal.filter(t=>t.done).length;$('childName').textContent=state.child.name;$('childAge').textContent=state.child.age;$('operator').textContent='Operatore: '+state.operator;$('counter').textContent=done+'/'+normal.length;$('progress').style.width=(normal.length?done/normal.length*100:0)+'%';$('date').textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let visible=state.tasks.filter(t=>filter==='all'||(filter==='todo'?(!t.done&&!(t.entries||[]).length):(t.done||(t.entries||[]).length)));$('tasks').innerHTML=visible.length?visible.map(t=>{let c=(t.entries||[]).length;if(t.repeatable)return '<div class="task"><div><div class="name">'+detect(t.name)+' '+esc(t.name)+' <span class="repeat-count">'+c+' registrazioni</span></div></div><div class="actions"><button class="black" onclick="openRepeat('+t.id+')">Apri</button><button class="gray" onclick="edit('+t.id+')">Modifica</button><button class="red" onclick="del('+t.id+')">Elimina</button></div></div>';return '<div class="task '+(t.done?'done':'')+'"><div><div class="name">'+detect(t.name)+' '+esc(t.name)+'</div>'+(t.done?'<div class="meta">FATTO · '+esc(t.time)+' · '+esc(t.who)+'</div>':'')+'</div><div class="actions">'+(t.done?'<button class="gray" onclick="undo('+t.id+')">Annulla</button>':'<button class="green" onclick="complete('+t.id+')">FATTO</button>')+'<button class="gray" onclick="edit('+t.id+')">Modifica</button><button class="red" onclick="del('+t.id+')">Elimina</button></div></div>'}).join(''):'<div class="empty">Nessuna attività.</div>';let logs=[];state.tasks.forEach(t=>{if(t.done)logs.push({time:t.time,text:t.name+' · '+t.who});(t.entries||[]).forEach(e=>logs.push({time:e.time,text:t.name+' · '+e.who+(e.detail?' · '+e.detail:'') }))});logs.sort((a,b)=>a.time.localeCompare(b.time));$('logs').innerHTML=logs.length?logs.reverse().slice(0,12).map(x=>'<div class="log"><b>'+esc(x.time)+'</b> · '+esc(x.text)+'</div>').join(''):'<div class="small">Nessuna attività completata.</div>'}
function archiveIfNeeded(){let today=dayKey(new Date());if(today===state.day)return;state.diary.unshift({date:state.day,child:JSON.parse(JSON.stringify(state.child)),tasks:JSON.parse(JSON.stringify(state.tasks))});state.diary=state.diary.slice(0,90);state.tasks.forEach(t=>{t.done=false;t.time='';t.who='';t.entries=[]});state.day=today;save()}
function openDiary(){archiveIfNeeded();$('diary').style.display='block';renderDiary()}
function renderDiary(){let d=dayKey(diaryDate),snap=d===state.day?{date:state.day,child:state.child,tasks:state.tasks}:state.diary.find(x=>x.date===d);$('diaryChild').textContent=state.child.name+' — '+state.child.age;$('diaryDate').textContent=diaryDate.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});if(!snap){$('diaryCard').innerHTML='<div class="empty">Nessun dato salvato per questa giornata.</div>';return}let lines=[];snap.tasks.forEach(t=>{if(t.done)lines.push({time:t.time,text:t.name,who:t.who});(t.entries||[]).forEach(e=>lines.push({time:e.time,text:t.name+(e.detail?' · '+e.detail:'')+(e.note?' — '+e.note:''),who:e.who}))});lines.sort((a,b)=>a.time.localeCompare(b.time));$('diaryCard').innerHTML=lines.length?'<div class="line" style="font-weight:700"><span>Ora</span><span>Attività</span><span>Chi</span></div>'+lines.map(x=>'<div class="line"><span>'+esc(x.time)+'</span><span>'+esc(x.text)+'</span><small>'+esc(x.who)+'</small></div>').join(''):'<div class="empty">Nessuna registrazione.</div>'}
window.closeM=close;window.repeat=repeat;window.openRepeat=openRepeat;window.deleteEntry=deleteEntry;window.edit=edit;window.del=del;window.complete=complete;window.undo=undo;
load();seed();archiveIfNeeded();$('new').onclick=add;$('operator').onclick=operator;$('childBtn').onclick=child;$('diaryBtn').onclick=openDiary;$('backDiary').onclick=()=>{$('diary').style.display='none'};$('todayDiary').onclick=()=>{diaryDate=new Date();renderDiary()};$('prevDay').onclick=()=>{diaryDate.setDate(diaryDate.getDate()-1);renderDiary()};$('nextDay').onclick=()=>{diaryDate.setDate(diaryDate.getDate()+1);renderDiary()};$('goDate').onclick=()=>{if($('datePicker').value)diaryDate=new Date($('datePicker').value+'T12:00:00');renderDiary()};[['all','all'],['todo','todo'],['done','done']].forEach(([id,f])=>$(id).onclick=()=>{filter=f;['all','todo','done'].forEach(x=>$(x).className=x===f?'black':'gray');render()});$('modal').onclick=e=>{if(e.target===$('modal'))close()};render();setInterval(()=>{let old=state.day;archiveIfNeeded();if(old!==state.day)render()},30000)})();
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
